<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asada Tacos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tan: { 400: '#d5b996', 500: '#c5a57d', 600: '#b08f68', 700: '#8c6f4d', 950: '#3a2b1c' }
                    },
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen pb-20 flex flex-col justify-between">
    <div class="max-w-md mx-auto w-full flex-grow">
        <!-- Landing View -->
        <div id="landingView" class="p-6 flex flex-col items-center justify-center min-h-[90vh] text-center">
            <div class="w-24 h-24 rounded-full border-2 border-tan-500 p-1 mb-4 flex items-center justify-center shadow-lg shadow-tan-500/10">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-tan-500">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM17.28 14.71C16.94 15.39 16.4 15.93 15.71 16.28C14.54 16.86 13.14 16.63 12 15.86C10.86 16.63 9.46 16.86 8.29 16.28C7.6 15.93 7.06 15.39 6.72 14.71C6.27 13.8 6.35 12.65 6.94 11.66C7.43 10.83 8.27 10.23 9.25 10.05C10.3 9.85 11.36 10.28 12 11.14C12.64 10.28 13.7 9.85 14.75 10.05C15.73 10.23 16.57 10.83 17.06 11.66C17.65 12.65 17.73 13.8 17.28 14.71Z" fill="currentColor"/>
                </svg>
            </div>
            <h1 class="text-4xl font-serif font-bold tracking-widest mb-2 uppercase text-white">Asada<br>Tacos</h1>
            <p class="text-tan-400 text-[10px] mb-5 tracking-[0.3em] uppercase font-medium">Sabor Original</p>
            
            <div id="storeStatusBadge" class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-emerald-400 flex items-center gap-2 w-full justify-center">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="storeStatusText">Loading Status...</span>
            </div>

            <div id="waitTimeWarningBanner" class="hidden w-full bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-6 text-xs text-amber-400 flex items-center gap-2 justify-center">
                <span>⚠</span> <span id="waitTimeWarningText">Kitchen is currently running a slightly higher wait time.</span>
            </div>

            <div class="w-full space-y-3">
                <button onclick="switchView('menu')" class="w-full bg-tan-600 hover:bg-tan-500 text-zinc-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-tan-600/25">Start Order</button>
                <button onclick="switchView('tracker')" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 font-medium py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm"><span>📍</span> Track Order Status</button>
            </div>
        </div>

        <!-- Menu View -->
        <div id="menuView" class="p-4 hidden">
            <div class="flex items-center justify-between mb-4 sticky top-0 bg-zinc-950/90 backdrop-blur py-2 z-10 border-b border-zinc-900">
                <button onclick="switchView('landing')" class="text-zinc-400 text-sm hover:text-white">← Back</button>
                <h2 class="font-serif font-bold text-lg tracking-wide uppercase">Order Menu</h2>
                <div class="w-10"></div>
            </div>

            <div id="menuContainer" class="space-y-6"></div>
            
            <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto z-40">
                <button onclick="openCartModal()" class="w-full bg-tan-600 hover:bg-tan-500 text-zinc-950 font-bold py-3 rounded-xl shadow-xl flex justify-between px-5 items-center">
                    <span id="cartCountBadge" class="bg-tan-700 text-white px-2 py-0.5 rounded-md text-xs font-bold">0 items</span>
                    <span>View Cart</span>
                    <span id="cartTotalBadge">$0.00</span>
                </button>
            </div>
        </div>

        <!-- Tracker View -->
        <div id="trackerView" class="p-4 hidden">
            <div class="flex items-center justify-between mb-4 border-b border-zinc-900 pb-2">
                <button onclick="switchView('landing')" class="text-zinc-400 text-sm hover:text-white">← Back</button>
                <h2 class="font-serif font-bold text-lg tracking-wide uppercase">Live Order Tracker</h2>
                <div class="w-10"></div>
            </div>
            <div class="space-y-3" id="activeOrdersList"></div>
        </div>
    </div>

    <!-- Modals (Item, Cart, Success) -->
    <div id="itemModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center"><h3 id="itemModalTitle" class="font-bold text-lg text-tan-400 font-serif">Add to Order</h3><button onclick="closeItemModal()" class="text-zinc-400 hover:text-white text-sm">✕</button></div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Quantity</label>
                <div class="flex items-center gap-3">
                    <button onclick="adjustModalQty(-1)" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-base font-bold flex items-center justify-center">-</button>
                    <span id="itemModalQty" class="text-lg font-mono font-bold flex-1 text-center text-tan-400">1</span>
                    <button onclick="adjustModalQty(1)" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-base font-bold flex items-center justify-center">+</button>
                </div>
            </div>
            <button onclick="confirmAddToCart()" class="w-full bg-tan-600 hover:bg-tan-500 text-zinc-950 font-bold py-3 rounded-xl transition shadow-lg shadow-tan-600/20">Add to Cart</button>
        </div>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3"><h3 class="font-bold text-lg font-serif">Your Cart</h3><button onclick="closeCartModal()" class="text-zinc-400 hover:text-white text-sm">✕</button></div>
            <div id="cartItemsList" class="space-y-3"></div>
            <div class="space-y-3 pt-2 border-t border-zinc-800">
                <div><label class="block text-xs text-zinc-400 mb-1">Your Name</label><input type="text" id="customerName" placeholder="Enter name" class="w-full bg-zinc-950 border border-zinc-800 focus:border-tan-500 outline-none rounded-xl p-3 text-sm text-zinc-200"></div>
            </div>
            <button onclick="submitOrder()" class="w-full bg-tan-600 hover:bg-tan-500 text-zinc-950 font-bold py-3 rounded-xl transition">Place Order</button>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-6 text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">✓</div>
            <h3 class="font-bold text-lg text-zinc-100 font-serif">Order Sent to Kitchen!</h3>
            <button onclick="closeSuccessModal()" class="w-full bg-tan-600 hover:bg-tan-500 text-zinc-950 font-bold py-2.5 rounded-xl text-xs transition">View in Tracker</button>
        </div>
    </div>

    <!-- SUPABASE CLOUD CONNECTION -->
    <script>
        const supabase = window.supabase.createClient('https://glkdqkosvrvbkghuxzux.supabase.co', 'Sb_publishable_DJdOcreCqOKFHsBVZCMc6g_6e9c3W-_');
        
        let localCart = [];
        let cloudMenu = [];
        let storeSettings = { is_open: true, closing_time: "8:40 PM", extra_wait: "" };
        let liveOrders = [];

        async function initApp() {
            // Seed defaults if empty (Handles frictionless demo)
            const { data: menuCheck } = await supabase.from('menu_items').select('*');
            if (!menuCheck || menuCheck.length === 0) {
                await supabase.from('menu_items').insert([
                    { name: "2 Quesadillas", category: "Mesquite", price: 15.99, prep_time: "5 mins", sold_out: false },
                    { name: "3 Cheesy Tacos", category: "Mesquite", price: 14.99, prep_time: "5 mins", sold_out: false },
                    { name: "Asada Papa", category: "Mesquite", price: 13.99, prep_time: "6 mins", sold_out: false }
                ]);
            }
            
            const { data: settingsCheck } = await supabase.from('store_settings').select('*');
            if (!settingsCheck || settingsCheck.length === 0) {
                await supabase.from('store_settings').insert([{ is_open: true, closing_time: "8:40 PM", extra_wait: "" }]);
            }

            fetchData();

            // Real-Time Listeners!
            supabase.channel('public:menu_items').on('postgres_changes', { event: '*', schema: 'public', table: 'menu_items' }, fetchData).subscribe();
            supabase.channel('public:store_settings').on('postgres_changes', { event: '*', schema: 'public', table: 'store_settings' }, fetchData).subscribe();
            supabase.channel('public:orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchOrders).subscribe();
        }

        async function fetchData() {
            const { data: mData } = await supabase.from('menu_items').select('*');
            cloudMenu = mData || [];
            
            const { data: sData } = await supabase.from('store_settings').select('*').limit(1);
            if(sData && sData.length > 0) storeSettings = sData[0];

            updateLandingUI();
            renderMenu();
            fetchOrders();
        }

        async function fetchOrders() {
            const { data: oData } = await supabase.from('orders').select('*').order('timestamp', { ascending: false });
            liveOrders = (oData || []).filter(o => o.status !== 'Fulfilled' && o.status !== 'Canceled');
            renderTracker();
        }

        function updateLandingUI() {
            const statusBadge = document.getElementById('storeStatusBadge');
            const statusText = document.getElementById('storeStatusText');
            if (storeSettings.is_open) {
                statusBadge.className = "bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-emerald-400 flex items-center gap-2 w-full justify-center";
                statusText.innerText = `Open Now • Until ${storeSettings.closing_time}`;
            } else {
                statusBadge.className = "bg-rose-500/10 border border-rose-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-rose-400 flex items-center gap-2 w-full justify-center";
                statusText.innerText = "Closed Right Now";
            }

            const waitBanner = document.getElementById('waitTimeWarningBanner');
            if (storeSettings.extra_wait) {
                waitBanner.classList.remove('hidden');
                document.getElementById('waitTimeWarningText').innerText = `Kitchen is busy (+${storeSettings.extra_wait}m wait).`;
            } else {
                waitBanner.classList.add('hidden');
            }
        }

        function switchView(view) {
            ['landingView', 'menuView', 'trackerView'].forEach(v => document.getElementById(v).style.display = 'none');
            document.getElementById(view + 'View').style.display = view === 'landing' ? 'flex' : 'block';
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = cloudMenu.map(item => `
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center ${item.sold_out ? 'opacity-50' : ''}">
                    <div>
                        <h4 class="font-bold text-sm text-zinc-100">${item.name} ${item.sold_out ? '<span class="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 rounded">SOLD OUT</span>' : ''}</h4>
                        <div class="flex gap-3 mt-1"><span class="text-sm font-semibold text-tan-500">$${item.price.toFixed(2)}</span></div>
                    </div>
                    <button ${item.sold_out ? 'disabled' : ''} onclick="openItemModal(${item.id})" class="bg-tan-600 hover:bg-tan-500 text-zinc-950 px-3 py-1.5 rounded-lg text-xs font-bold">Add +</button>
                </div>
            `).join('');
        }

        let currentModalItem = null; let currentModalQtyVal = 1;

        function openItemModal(id) {
            currentModalItem = cloudMenu.find(m => m.id === id);
            currentModalQtyVal = 1;
            document.getElementById('itemModalQty').innerText = 1;
            document.getElementById('itemModalTitle').innerText = `Add ${currentModalItem.name}`;
            document.getElementById('itemModal').style.display = 'flex';
        }

        function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }
        function adjustModalQty(delta) { currentModalQtyVal = Math.max(1, currentModalQtyVal + delta); document.getElementById('itemModalQty').innerText = currentModalQtyVal; }

        function confirmAddToCart() {
            const existing = localCart.find(c => c.id === currentModalItem.id);
            if (existing) existing.quantity += currentModalQtyVal;
            else localCart.push({ ...currentModalItem, quantity: currentModalQtyVal });
            updateCartBadges();
            closeItemModal();
        }

        function updateCartBadges() {
            const count = localCart.reduce((s, i) => s + i.quantity, 0);
            const total = localCart.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('cartCountBadge').innerText = `${count} items`;
            document.getElementById('cartTotalBadge').innerText = `$${total.toFixed(2)}`;
        }

        function openCartModal() {
            if (localCart.length === 0) return alert("Cart is empty!");
            document.getElementById('cartItemsList').innerHTML = localCart.map((item, idx) => `
                <div class="flex justify-between items-center bg-zinc-950 p-3 rounded border border-zinc-800 text-sm">
                    <div><div class="font-bold text-zinc-100">${item.name}</div><div class="text-xs text-tan-500">$${(item.price * item.quantity).toFixed(2)}</div></div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-mono w-4 text-center text-zinc-100">${item.quantity}x</span>
                        <button onclick="localCart.splice(${idx}, 1); openCartModal(); updateCartBadges();" class="text-zinc-500 hover:text-rose-400 text-xs">✕</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

        async function submitOrder() {
            if (localCart.length === 0) return;
            const nameInput = document.getElementById('customerName').value.trim() || 'Guest';
            const summary = localCart.map(i => `${i.quantity}x ${i.name}`).join(', ');
            const total = localCart.reduce((s, i) => s + (i.price * i.quantity), 0);

            // SEND TO CLOUD DATABASE
            await supabase.from('orders').insert([{
                name: nameInput,
                items: summary,
                status: "Preparing",
                total: total,
                notes: "",
                timestamp: Date.now()
            }]);

            localCart = []; updateCartBadges(); closeCartModal();
            document.getElementById('successModal').style.display = 'flex';
        }

        function closeSuccessModal() { document.getElementById('successModal').style.display = 'none'; switchView('tracker'); }

        function renderTracker() {
            const container = document.getElementById('activeOrdersList');
            if (liveOrders.length === 0) return container.innerHTML = `<div class="text-center text-zinc-500 py-8 text-xs">No active orders right now.</div>`;
            container.innerHTML = liveOrders.map(o => `
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-xs text-tan-500 font-mono font-bold">${o.name}</span>
                        <div class="text-[11px] text-zinc-400 mt-0.5">${o.items}</div>
                        <span class="inline-block mt-2 px-2.5 py-1 rounded-full text-xs font-medium ${o.status === 'Preparing' ? 'bg-amber-500/10 text-amber-500' : 'bg-emerald-500/10 text-emerald-400'}">${o.status}</span>
                    </div>
                </div>
            `).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
